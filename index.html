<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Woods | Sustainable Retail & Eco-Cafe</title>
    <meta name="description" content="El Woods - A sustainable retail and eco-cafe experience in Wheat Ridge, Colorado. Curated buy-sell-trade fashion, locally roasted coffee, and community events.">

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="public/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="public/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="public/apple-touch-icon.png">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="El Woods | Sustainable Retail & Eco-Cafe">
    <meta property="og:description" content="A sustainable retail and eco-cafe experience in Wheat Ridge, Colorado. Curated buy-sell-trade fashion, locally roasted coffee, and community events.">
    <meta property="og:image" content="public/ElWoods_ForestBanner2.jpg">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            font-family: 'Source Serif 4', Georgia, serif;
        }

        .landing {
            position: relative;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .background {
            position: absolute;
            inset: 0;
            z-index: -1;
        }

        .background img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center 30%;
        }

        .background::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(
                to bottom,
                rgba(10, 20, 10, 0.7) 0%,
                rgba(10, 20, 10, 0.5) 40%,
                rgba(10, 20, 10, 0.7) 100%
            );
        }

        .content {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 2rem;
            max-width: 800px;
        }

        .logo {
            width: 200px;
            height: 200px;
            margin: 0 auto 2rem;
            filter: drop-shadow(0 0 30px rgba(201, 169, 89, 0.4));
            animation: glow 4s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% {
                filter: drop-shadow(0 0 20px rgba(201, 169, 89, 0.4));
                transform: scale(1);
            }
            50% {
                filter: drop-shadow(0 0 40px rgba(201, 169, 89, 0.6));
                transform: scale(1.02);
            }
        }

        @media (min-width: 768px) {
            .logo {
                width: 280px;
                height: 280px;
            }
        }

        .tagline {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: 2rem;
            font-style: italic;
            font-weight: 500;
            color: #d4b86a;
            margin-bottom: 1rem;
            text-shadow: 0 2px 20px rgba(0,0,0,0.5);
        }

        @media (min-width: 768px) {
            .tagline {
                font-size: 3rem;
            }
        }

        .subtitle {
            font-size: 1.1rem;
            color: rgba(250, 249, 246, 0.9);
            font-weight: 300;
            letter-spacing: 0.05em;
            margin-bottom: 3rem;
        }

        @media (min-width: 768px) {
            .subtitle {
                font-size: 1.25rem;
            }
        }

        .cta-group {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            align-items: center;
        }

        @media (min-width: 480px) {
            .cta-group {
                flex-direction: row;
                justify-content: center;
            }
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 1rem 2rem;
            font-family: 'Source Serif 4', Georgia, serif;
            font-size: 1rem;
            font-weight: 500;
            text-decoration: none;
            border-radius: 50px;
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, #c9a959 0%, #d4b86a 100%);
            color: #1a2e1a;
            box-shadow: 0 4px 20px rgba(201, 169, 89, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(201, 169, 89, 0.5);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #faf9f6;
            border: 1px solid rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(10px);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .social {
            position: absolute;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: rgba(250, 249, 246, 0.7);
            font-size: 0.9rem;
            transition: color 0.3s ease;
        }

        .social:hover {
            color: #d4b86a;
        }

        .social svg {
            width: 20px;
            height: 20px;
        }

        .divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            margin: 2rem 0;
        }

        .divider span {
            width: 60px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(201, 169, 89, 0.5), transparent);
        }

        .divider-dot {
            width: 6px;
            height: 6px;
            background: rgba(201, 169, 89, 0.5);
            border-radius: 50%;
        }

        .coming-soon {
            font-size: 0.85rem;
            color: rgba(250, 249, 246, 0.6);
            text-transform: uppercase;
            letter-spacing: 0.2em;
            margin-bottom: 0.5rem;
        }
    </style>
</head>
<body>

            @elwoods.revival
        </a>
    </div>
</body>
</html>
